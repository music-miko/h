call_1: "⚠️ <b>إذن مفقود</b>\nيحتاج البوت إلى إذن <b>دعوة المستخدمين عبر الرابط</b> لدعوة حساب المساعد."
call_2: "🚫 <b>المساعد محظور</b>\n\nحساب المساعد محظور في هذه المجموعة/القناة.\n\n🆔 <b>المعرف:</b> <code>{1}</code>\n👤 <b>الاسم:</b> {2}\n🔗 <b>المعرف:</b> @{3}\n\n<i>يرجى رفع الحظر عن المساعد والمحاولة مرة أخرى.</i>"
call_3: "❌ <b>فشلت الدعوة</b>\nتعذر دعوة المساعد {0} إلى دردشتك.\n\n<b>السبب:</b> <code>{1}</code>"
call_4: "🔄 <b>جارٍ المعالجة...</b>\nتتم دعوة المساعد {0} إلى الدردشة."
call_5: "✅ <b>انضم المساعد</b>\nانضم {0} بنجاح.\n<i>جارٍ محاولة بدء البث...</i>"
