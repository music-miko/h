call_10: "☁️ <b>خطأ في خادم تيليجرام</b>\nيواجه تيليجرام مشاكل داخلية. يرجى المحاولة مرة أخرى لاحقًا."
call_11: "🔇 <b>لم يتم العثور على مصدر صوت</b>\nلم يتم العثور على مصدر صوتي. يرجى محاولة تشغيل المقطع مرة أخرى."
call_12: "🚫 <b>لم يتم العثور على مصدر فيديو</b>\nلم يتم العثور على مصدر فيديو. يرجى محاولة تشغيل المقطع مرة أخرى."

