general_1: "ℹ️ <b>مطلوب إدخال</b>\nيرجى الرد على رسالة المستخدم أو تقديم اسم مستخدم/معرف صالح."
general_2: "❌ <b>خطأ في المعالجة</b>\n\nحدث خطأ أثناء معالجة طلبك.\n<b>الاستثناء:</b> <code>{0}</code>"
general_3: "⚠️ <b>تم اكتشاف مسؤول مجهول</b>\nيرجى التبديل إلى حساب المستخدم الشخصي الخاص بك لاستخدام هذه الميزة."
general_4: "🚫 <b>تم رفض الإذن</b>\nليس لديك الصلاحيات الكافية لإدارة مكالمات الفيديو.\n\n<i>أعد تحميل ذاكرة التخزين المؤقت للمسؤولين باستخدام /reload.</i>"
general_5: "🔇 البوت لا يقوم بالبث حاليًا في مكالمة الفيديو."

tg_1: "📥 <b>{0} أداة التحميل</b>\n\n💾 <b>حجم الملف:</b> {1}\n✅ <b>اكتمل:</b> {2}\n📊 <b>التقدم:</b> {3}%\n\n🚀 <b>السرعة:</b> {4}/ث\n⏳ <b>الوقت المتبقي:</b> {5}"
