call_7: "📥 <b>تحميل المقطع التالي</b>\nيرجى الانتظار بينما نقوم بتجهيز الأغنية التالية من قائمة الانتظار..."
call_8: "🚫 <b>لا توجد مكالمة فيديو نشطة</b>\nيرجى بدء مكالمة فيديو في هذه المجموعة والمحاولة مرة أخرى."
